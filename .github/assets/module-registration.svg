    .mr-b-mauve { fill: var(--mauve-soft); stroke: var(--mauve-edge); }
    .mr-b-slate { fill: var(--slate-soft); stroke: var(--slate-edge); }
    .mr-ln { fill: none; stroke: var(--line); stroke-width: 1.6; }
    .mr-ln-coral { fill: none; stroke: var(--coral); stroke-width: 1.8; }
    .mr-ln-mauve { fill: none; stroke: var(--mauve); stroke-width: 1.6; }
    .mr-dash { stroke-dasharray: 5 4; }
    .mr-ah { fill: var(--line); } .mr-ah-coral { fill: var(--coral); } .mr-ah-mauve { fill: var(--mauve); }
    .mr-dot-coral { fill: var(--coral); } .mr-dot-slate { fill: var(--slate); } .mr-dot-mauve { fill: var(--mauve); }
    .mr-badge { fill: var(--slate); } .mr-badge-t { fill: var(--panel); font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; }
</style>
<defs>
    <marker id="mr-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mr-ah"/></marker>
    <marker id="mr-a-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mr-ah-coral"/></marker>
    <marker id="mr-a-mauve" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mr-ah-mauve"/></marker>
