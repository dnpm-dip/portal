<rect x="0" y="0" width="960" height="500" rx="16" class="mr-panel"/>
<text x="32" y="42" class="mr-t mr-h1">How a feature module plugs into the portal</text>
<text x="32" y="64" class="mr-t mr-sub">packages/mtb/src/module.ts. admin and rd follow the same three steps.</text>
<rect x="32" y="88" width="276" height="394" rx="10" class="mr-b-coral" stroke-width="1.2"/>
<text x="48" y="110" class="mr-eb">@dnpm-dip/mtb · nuxt module</text>
<rect x="46" y="122" width="248" height="66" rx="8" class="mr-b-neutral" stroke-width="1.2"/>
<circle cx="64" cy="144" r="10" class="mr-badge"/>
<text x="64" y="148" class="mr-badge-t" text-anchor="middle">1</text>
<text x="82" y="148" class="mr-m">registerPages({</text>
<text x="82" y="168" class="mr-m">baseURL: '/mtb/' })</text>
<path d="M294 155 H346" class="mr-ln-coral" marker-end="url(#mr-a-coral)"/>
<rect x="46" y="252" width="248" height="66" rx="8" class="mr-b-neutral" stroke-width="1.2"/>
<circle cx="64" cy="274" r="10" class="mr-badge"/>
