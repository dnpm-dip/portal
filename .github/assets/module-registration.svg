<svg width="960" height="500" viewBox="0 0 960 500" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mr-title mr-desc" class="mr-root">
<title id="mr-title">How a feature module plugs into the portal</title>
<desc id="mr-desc">The mtb Nuxt module does three things in module.ts. First, registerPages from @dnpm-dip/nuxt-kit turns runtime/pages into routes under /mtb at build time. Second, its api plugin runs after the portal plugin dnpm:kit, wraps the base HTTP client that carries the Authup bearer token in an MTBAPIClient, and calls the DNPM:DIP API at mtb/queries. Third, its register plugin runs after dnpm:register and calls the register hook with the name MTB, the base URL /mtb/ and menu items; the portal adds MTB to the top bar and shows the Suche entry only with mtb_query_submit. admin and rd do the same.</desc>
<style>
    .mr-root {
        --panel: #F7F6F7; --card: #FFFFFF; --edge: #DAD4D8; --ink: #2B2F36; --muted: #646973; --line: #8F8A8E;
        --coral: #C93A37; --coral-soft: #FDEDED; --coral-edge: #EFA7A5;
        --mauve: #84586F; --mauve-soft: #F6EFF3; --mauve-edge: #D9C4D0;
        --slate: #2B2F36; --slate-soft: #EEF0F2; --slate-edge: #BFC5CC;
    }
    @media (prefers-color-scheme: dark) {
        .mr-root {
            --panel: #13161B; --card: #1B1F26; --edge: #313741; --ink: #E7E8EA; --muted: #A2A7AF; --line: #737A84;
            --coral: #F98583; --coral-soft: #351E21; --coral-edge: #7C3A3A;
            --mauve: #D6C0CC; --mauve-soft: #2A2330; --mauve-edge: #584A5C;
            --slate: #C7CCD4; --slate-soft: #222831; --slate-edge: #454D59;
        }
    }
