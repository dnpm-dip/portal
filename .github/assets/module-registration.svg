    .mr-t { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); font-size: 13px; }
    .mr-m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: var(--ink); }
    .mr-h1 { font-size: 18px; font-weight: 600; }
    .mr-h2 { font-size: 14.5px; font-weight: 600; }
    .mr-sub { fill: var(--muted); }
    .mr-eb { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; letter-spacing: 0.06em; fill: var(--muted); }
    .mr-c-coral { fill: var(--coral); } .mr-c-mauve { fill: var(--mauve); } .mr-c-muted { fill: var(--muted); }
    .mr-b-neutral { fill: var(--card); stroke: var(--edge); }
