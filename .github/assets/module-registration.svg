<text x="82" y="278" class="mr-m">addPlugin(</text>
<text x="82" y="298" class="mr-m">'runtime/plugins/api')</text>
<path d="M294 285 H346" class="mr-ln-coral" marker-end="url(#mr-a-coral)"/>
<rect x="46" y="382" width="248" height="66" rx="8" class="mr-b-neutral" stroke-width="1.2"/>
<circle cx="64" cy="404" r="10" class="mr-badge"/>
<text x="64" y="408" class="mr-badge-t" text-anchor="middle">3</text>
<text x="82" y="408" class="mr-m">addPlugin(</text>
<text x="82" y="428" class="mr-m">'runtime/plugins/register')</text>
<path d="M294 415 H346" class="mr-ln-coral" marker-end="url(#mr-a-coral)"/>
<rect x="358" y="96" width="276" height="118" rx="10" class="mr-b-mauve" stroke-width="1.2"/>
<text x="374" y="118" class="mr-eb">build time · nuxt-kit</text>
<text x="374" y="138" class="mr-t mr-h2">Pages become routes</text>
<text x="374" y="158" class="mr-t">scans runtime/pages/**</text>
<text x="374" y="177" class="mr-t">prefixes every path with /mtb</text>
<text x="374" y="196" class="mr-t">adds them in pages:extend</text>
<path d="M634 155 H674" class="mr-ln" marker-end="url(#mr-a)"/>
<rect x="686" y="96" width="242" height="118" rx="10" class="mr-b-slate" stroke-width="1.2"/>
<text x="702" y="118" class="mr-eb">portal router</text>
<text x="702" y="138" class="mr-t mr-h2">Routes</text>
<text x="702" y="158" class="mr-m">/mtb</text>
<text x="702" y="177" class="mr-m">/mtb/query/:id()/summary/…</text>
<text x="702" y="196" class="mr-m">/mtb/validation</text>
<rect x="358" y="226" width="276" height="118" rx="10" class="mr-b-mauve" stroke-width="1.2"/>
<text x="374" y="248" class="mr-eb">runtime · after dnpm:kit</text>
<text x="374" y="268" class="mr-t mr-h2">Module API client</text>
<text x="374" y="288" class="mr-t">injectHTTPClient(): base client</text>
<text x="374" y="307" class="mr-t">Authup bearer token attached</text>
<text x="374" y="326" class="mr-t">new MTBAPIClient(client)</text>
<path d="M634 285 H674" class="mr-ln" marker-end="url(#mr-a)"/>
<rect x="686" y="226" width="242" height="118" rx="10" class="mr-b-slate" stroke-width="1.2"/>
<text x="702" y="248" class="mr-eb">DNPM:DIP API (API_URL)</text>
<text x="702" y="268" class="mr-t mr-h2">Requests</text>
<text x="702" y="288" class="mr-m">POST mtb/queries</text>
<text x="702" y="307" class="mr-m">GET mtb/queries/:id/…</text>
<text x="702" y="326" class="mr-m">GET mtb/kaplan-meier/config</text>
<rect x="358" y="356" width="276" height="118" rx="10" class="mr-b-mauve" stroke-width="1.2"/>
<text x="374" y="378" class="mr-eb">runtime · after dnpm:register</text>
<text x="374" y="398" class="mr-t mr-h2">Module registers itself</text>
<text x="374" y="418" class="mr-t">callHook('register', meta)</text>
<text x="374" y="437" class="mr-t">name 'MTB', baseURL '/mtb/'</text>
<text x="374" y="456" class="mr-t">menu items with permissions</text>
<path d="M634 415 H674" class="mr-ln" marker-end="url(#mr-a)"/>
