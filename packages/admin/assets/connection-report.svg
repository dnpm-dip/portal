<circle cx="648" cy="364" r="5" class="cr-dot-slate"/>
<text x="660" y="368.5" class="cr-t">peer · online</text>
<rect x="790" y="318" width="120" height="36" rx="18" class="cr-b-neutral" stroke-width="1.2"/>
