<circle cx="808" cy="168" r="5" class="cr-dot-coral"/>
<text x="820" y="172.5" class="cr-t">peer · offline</text>
<rect x="470" y="318" width="120" height="36" rx="18" class="cr-b-neutral" stroke-width="1.2"/>
