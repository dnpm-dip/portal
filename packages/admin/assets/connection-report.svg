<text x="690" y="266" class="cr-t cr-sub" text-anchor="middle">this site</text>
<rect x="470" y="150" width="120" height="36" rx="18" class="cr-b-neutral" stroke-width="1.2"/>
<circle cx="488" cy="168" r="5" class="cr-dot-slate"/>
<text x="500" y="172.5" class="cr-t">peer · online</text>
<rect x="630" y="122" width="120" height="36" rx="18" class="cr-b-neutral" stroke-width="1.2"/>
<circle cx="648" cy="140" r="5" class="cr-dot-slate"/>
<text x="660" y="144.5" class="cr-t">peer · online</text>
