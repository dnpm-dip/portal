<svg width="960" height="431" viewBox="0 0 960 431" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="qm-title qm-desc" class="qm-root">
<title id="qm-title">An MTB query, from search to patient record</title>
<desc id="qm-desc">On /mtb the Suche page (MSearchForm, needs mtb_query_submit) posts the criteria and a mode (local for the own site or federated for all sites) to mtb/queries and gets a query with an id and expiresAfter. Changing the criteria later sends PUT mtb/queries/:id. The query pages under /mtb/query/:id() then read everything below mtb/queries/:id: the filter options for diagnosis, therapy and therapy recommendation; the summary endpoints demographics, tumor-diagnostics, gene-alterations, medication, therapy-responses and survival-statistics; and patient-matches and patient-record/:pid. The query session store tracks the query and fires SESSION_EXPIRING five minutes before it expires; the portal plugin then fetches the query again and tracks it anew.</desc>
<style>
    .qm-root {
        --panel: #F7F6F7; --card: #FFFFFF; --edge: #DAD4D8; --ink: #2B2F36; --muted: #646973; --line: #8F8A8E;
        --coral: #C93A37; --coral-soft: #FDEDED; --coral-edge: #EFA7A5;
        --mauve: #84586F; --mauve-soft: #F6EFF3; --mauve-edge: #D9C4D0;
        --slate: #2B2F36; --slate-soft: #EEF0F2; --slate-edge: #BFC5CC;
    }
    @media (prefers-color-scheme: dark) {
        .qm-root {
            --panel: #13161B; --card: #1B1F26; --edge: #313741; --ink: #E7E8EA; --muted: #A2A7AF; --line: #737A84;
            --coral: #F98583; --coral-soft: #351E21; --coral-edge: #7C3A3A;
            --mauve: #D6C0CC; --mauve-soft: #2A2330; --mauve-edge: #584A5C;
            --slate: #C7CCD4; --slate-soft: #222831; --slate-edge: #454D59;
        }
    }
    .qm-panel { fill: var(--panel); }
    .qm-t { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); font-size: 13px; }
    .qm-m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; fill: var(--ink); }
    .qm-h1 { font-size: 18px; font-weight: 600; }
    .qm-h2 { font-size: 14.5px; font-weight: 600; }
    .qm-sub { fill: var(--muted); }
    .qm-eb { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; letter-spacing: 0.06em; fill: var(--muted); }
    .qm-c-coral { fill: var(--coral); } .qm-c-mauve { fill: var(--mauve); } .qm-c-muted { fill: var(--muted); }
    .qm-b-neutral { fill: var(--card); stroke: var(--edge); }
    .qm-b-coral { fill: var(--coral-soft); stroke: var(--coral-edge); }
    .qm-b-mauve { fill: var(--mauve-soft); stroke: var(--mauve-edge); }
    .qm-b-slate { fill: var(--slate-soft); stroke: var(--slate-edge); }
    .qm-ln { fill: none; stroke: var(--line); stroke-width: 1.6; }
    .qm-ln-coral { fill: none; stroke: var(--coral); stroke-width: 1.8; }
    .qm-ln-mauve { fill: none; stroke: var(--mauve); stroke-width: 1.6; }
    .qm-dash { stroke-dasharray: 5 4; }
    .qm-ah { fill: var(--line); } .qm-ah-coral { fill: var(--coral); } .qm-ah-mauve { fill: var(--mauve); }
    .qm-dot-coral { fill: var(--coral); } .qm-dot-slate { fill: var(--slate); } .qm-dot-mauve { fill: var(--mauve); }
    .qm-badge { fill: var(--slate); } .qm-badge-t { fill: var(--panel); font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; }
</style>
<defs>
    <marker id="qm-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="qm-ah"/></marker>
    <marker id="qm-a-coral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="qm-ah-coral"/></marker>
    <marker id="qm-a-mauve" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="qm-ah-mauve"/></marker>
</defs>
<rect x="0" y="0" width="960" height="431" rx="16" class="qm-panel"/>
<text x="32" y="42" class="qm-t qm-h1">An MTB query, from search to patient record</text>
<text x="32" y="64" class="qm-t qm-sub">Every request goes to API_URL/mtb/…; the query id is the handle for all of them.</text>
<rect x="32" y="92" width="230" height="150" rx="10" class="qm-b-neutral" stroke-width="1.2"/>
<text x="48" y="114" class="qm-eb">/mtb · Suche</text>
<text x="48" y="134" class="qm-t qm-h2">MSearchForm</text>
<text x="48" y="154" class="qm-m qm-c-coral">mtb_query_submit</text>
<text x="48" y="173" class="qm-t qm-sub">mode: local (own site)</text>
<text x="48" y="192" class="qm-t qm-sub">or federated (all sites)</text>
<path d="M262 150 H306" class="qm-ln-coral" marker-end="url(#qm-a-coral)"/>
<text x="270" y="140" class="qm-m qm-c-muted">POST</text>
<rect x="318" y="92" width="260" height="150" rx="10" class="qm-b-coral" stroke-width="1.2"/>
<text x="334" y="114" class="qm-eb">mtb/queries</text>
<text x="334" y="134" class="qm-t qm-h2">Query { id, expiresAfter }</text>
<text x="334" y="154" class="qm-m">PUT mtb/queries/:id</text>
<text x="334" y="173" class="qm-t qm-sub">same form, changed criteria</text>
<text x="334" y="192" class="qm-m">then /mtb/query/:id()</text>
<rect x="630" y="84" width="298" height="97" rx="10" class="qm-b-slate" stroke-width="1.2"/>
<text x="646" y="106" class="qm-eb">filters</text>
<text x="646" y="128" class="qm-m">…/filters/diagnosis</text>
<text x="646" y="147" class="qm-m">…/filters/therapy</text>
<text x="646" y="166" class="qm-m">…/filters/therapy-recommendation</text>
<path d="M578 167 H604 V132.5 H628" class="qm-ln" marker-end="url(#qm-a)"/>
<rect x="630" y="193" width="298" height="116" rx="10" class="qm-b-slate" stroke-width="1.2"/>
<text x="646" y="215" class="qm-eb">summary</text>
<text x="646" y="237" class="qm-m">…/demographics  …/tumor-diagnostics</text>
<text x="646" y="256" class="qm-m">…/gene-alterations  …/medication</text>
<text x="646" y="275" class="qm-m">…/therapy-responses</text>
<text x="646" y="294" class="qm-m">…/survival-statistics</text>
<path d="M578 167 H604 V251 H628" class="qm-ln" marker-end="url(#qm-a)"/>
<rect x="630" y="321" width="298" height="78" rx="10" class="qm-b-slate" stroke-width="1.2"/>
<text x="646" y="343" class="qm-eb">patients</text>
<text x="646" y="365" class="qm-m">…/patient-matches</text>
<text x="646" y="384" class="qm-m">…/patient-record/:pid</text>
<path d="M578 167 H604 V360 H628" class="qm-ln" marker-end="url(#qm-a)"/>
<rect x="32" y="280" width="546" height="128" rx="12" class="qm-b-mauve" stroke-width="1.2"/>
<text x="48" y="304" class="qm-eb">query session · @dnpm-dip/vue + portal plugin</text>
<rect x="48" y="318" width="162" height="70" rx="10" class="qm-b-neutral" stroke-width="1.2"/>
<text x="60" y="342" class="qm-m">track(query)</text>
<text x="60" y="366" class="qm-t qm-sub">querySession store</text>
<path d="M210 353 H222" class="qm-ln-mauve" marker-end="url(#qm-a-mauve)"/>
<rect x="224" y="318" width="162" height="70" rx="10" class="qm-b-neutral" stroke-width="1.2"/>
<text x="236" y="342" class="qm-m">SESSION_EXPIRING</text>
<text x="236" y="366" class="qm-t qm-sub">5 min before expiry</text>
<path d="M386 353 H398" class="qm-ln-mauve" marker-end="url(#qm-a-mauve)"/>
<rect x="400" y="318" width="162" height="70" rx="10" class="qm-b-neutral" stroke-width="1.2"/>
<text x="412" y="342" class="qm-m">GET mtb/queries/:id</text>
<text x="412" y="366" class="qm-t qm-sub">then track() again</text>
<path d="M481 388 V398 H129 V390" class="qm-ln-mauve qm-dash" marker-end="url(#qm-a-mauve)"/>
</svg>
